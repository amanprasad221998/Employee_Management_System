<div style="max-width:600px">

  <!-- Header -->
  <div style="display:flex;align-items:center;
              gap:16px;margin-bottom:24px">
    <button (click)="goBack()"
            style="background:#666">
      ←
    </button>
    <h2>➕ Add New Employee</h2>
  </div>

  <!-- Success message -->
  <div class="alert-success"
       *ngIf="successMessage">
    ✅ {{ successMessage }}
    <br>
    <small>Redirecting to employee list...</small>
  </div>

  <!-- Form -->
  <div class="card"
       *ngIf="!successMessage">

    <form [formGroup]="employeeForm"
          (ngSubmit)="onSubmit()">

      <!-- Name -->
      <div class="form-group">
        <label>Full Name *</label>
        <input formControlName="name"
               placeholder="Enter full name">
        <div class="error"
             *ngIf="f['name'].invalid &&
                    f['name'].touched">
          <span *ngIf="f['name'].errors?.['required']">
            Name is required
          </span>
          <span *ngIf="f['name'].errors?.['minlength']">
            Name must be at least 3 characters
          </span>
          <span *ngIf="f['name'].errors?.['noNumbers']">
            Name cannot contain numbers
          </span>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email Address *</label>
        <input formControlName="email"
               type="email"
               placeholder="Enter email">
        <div class="error"
             *ngIf="f['email'].invalid &&
                    f['email'].touched">
          <span *ngIf="f['email'].errors?.['required']">
            Email is required
          </span>
          <span *ngIf="f['email'].errors?.['email']">
            Please enter a valid email
          </span>
        </div>
      </div>

      <!-- Department -->
      <div class="form-group">
        <label>Department *</label>
        <input formControlName="department"
               placeholder="Enter department">
        <div class="error"
             *ngIf="f['department'].invalid &&
                    f['department'].touched">
          <span *ngIf="f['department'].errors?.['required']">
            Department is required
          </span>
        </div>
      </div>

      <!-- City -->
      <div class="form-group">
        <label>City *</label>
        <input formControlName="city"
               placeholder="Enter city">
        <div class="error"
             *ngIf="f['city'].invalid &&
                    f['city'].touched">
          <span *ngIf="f['city'].errors?.['required']">
            City is required
          </span>
        </div>
      </div>

      <!-- Phone — optional -->
      <div class="form-group">
        <label>Phone
          <small style="color:#999">
            (optional)
          </small>
        </label>
        <input formControlName="phone"
               placeholder="Enter phone number">
      </div>

      <!-- Buttons -->
      <div style="display:flex;gap:12px">
        <button type="submit"
                [disabled]="employeeForm.invalid">
          Save Employee
        </button>
        <button type="button"
                (click)="goBack()"
                style="background:#666">
          Cancel
        </button>
      </div>

    </form>
  </div>
</div>
